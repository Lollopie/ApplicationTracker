# Render Blueprint for the Job Tracker. tracker-web serves the SPA under /tracker/ and forwards
# /tracker/api/* to tracker-api, so it works on its own URL and behind the home site's gateway alike.
# Render suffixed both service URLs (names were taken): if they ever change, update the API rewrite
# below and the home site's /tracker/* rewrite.
services:
  - type: web
    name: tracker-api
    runtime: image
    plan: free
    region: frankfurt # keep it next to the Neon database
    image:
      # Pushed by CI on every push to main. CI deploys a specific SHA tag through the deploy hook;
      # this tag is only the default. The package must be public, or add creds (Workspace registry credential).
      url: ghcr.io/lollopie/applicationtracker:latest
    healthCheckPath: /actuator/health
    envVars:
      # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # {bcrypt}... hash for the seeded admin, see the README
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # The cookies must be scoped to the gateway prefix and must not clash with the other app's cookies.
      - key: COOKIE_PATH
        value: /tracker
      - key: SESSION_COOKIE_NAME
        value: JT_SESSION
      - key: COOKIE_SECURE
        value: "true"
      # Serial GC and C1-only JIT suit the free instance's 0.1 CPU and shorten the cold start.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -XX:TieredStopAtLevel=1

  - type: web
    name: tracker-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    # Wait for the GitHub Actions run, so a commit with failing frontend tests is never deployed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_BASE
        value: /tracker/
      # The free tier puts tracker-api to sleep, so the SPA treats gateway errors as "waking up" and keeps retrying.
      - key: VITE_SERVER_SLEEPS
        value: "true"
      - key: NODE_VERSION
        value: "24"
    # The same headers nginx sends in Compose (frontend/security-headers.conf and nginx.conf).
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; frame-ancestors 'none'"
      - path: /tracker/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # The build is published under /tracker/ (VITE_BASE), so this site is a complete Job Tracker on its own:
    # https://tracker-web-y2tx.onrender.com/tracker/. The home gateway forwards /tracker/* here unchanged.
    routes:
      # Order matters: the API rule must come before the SPA fallback that would also match it.
      - type: rewrite
        source: /tracker/api/*
        destination: https://tracker-api-2igk.onrender.com/*
      # Client-side routes (/tracker/applications/...) all serve the SPA shell.
      - type: rewrite
        source: /tracker/*
        destination: /tracker/index.html
