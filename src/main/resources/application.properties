spring.application.name=main
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.serialization-mode=VIA_DTO
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.placeholders.admin_password_hash=${ADMIN_PASSWORD_HASH}
server.forward-headers-strategy=FRAMEWORK
server.port=${PORT:8080}
# Behind a path-based gateway (example.com/tracker/...) the cookies are scoped to that prefix and renamed,
# so they never clash with other apps on the same domain. The defaults suit local development.
server.servlet.session.cookie.path=${COOKIE_PATH:/}
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:JSESSIONID}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.session.jdbc.initialize-schema=never